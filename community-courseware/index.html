<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>走进我们的社区 · Our Community</title><style>html,body{height:100%;margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#eef8fb;color:#244b5b}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.dot{width:36px;height:36px;border:4px solid #b8dfe8;border-top-color:#16899a;border-radius:50%;margin:0 auto 14px;animation:r .9s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="dot"></div><div>正在打开互动课件…</div></div><script>(async()=>{try{const ps=[];for(let i=0;i<48;i++){const n=String(i).padStart(2,'0');const r=await fetch('./part-'+n+'.txt');if(!r.ok)throw new Error('加载失败 '+n);ps.push(await r.text())}const h=ps.join('');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="box"><h2>课件加载失败</h2><p>'+String(e.message||e)+'</p></div>'}})();</script></body></html>
